[package]
name = "google-ai-usage-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Lightweight Win32 HUD overlay to monitor Google AI Pro quota inside Google Antigravity"

[dependencies]
chrono = "0.4.45"
cosmic-text = "0.19.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
tiny-skia = "0.12.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_Debug", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_Graphics_GdiPlus"] }
