[package]
name = "google-ai-usage-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sysinfo = "0.39.6"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_Debug"] }
